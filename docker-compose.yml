services:
  replay-objects:
    build:
      context: .
      dockerfile: tools/live-e2e/infra/Dockerfile
    image: tuf-replay-local-infra
    command: ["node", "s3.mjs"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${REPLAY_OBJECTS_PORT:-9000}:9000"
    volumes:
      - tuf-replay-local-objects:/data
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:9000/'); process.exit(r.status === 403 ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  replay-cdn:
    build:
      context: .
      dockerfile: tools/live-e2e/infra/Dockerfile
    image: tuf-replay-local-infra
    restart: unless-stopped
    init: true
    depends_on:
      replay-objects:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REPLAY_CDN_PORT:-8787}:8787"
    volumes:
      - tuf-replay-local-cdn-cache:/data
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:8787/__health'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tuf_replay
      POSTGRES_PASSWORD: tuf_replay_dev
      POSTGRES_DB: tuf_replay_development
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuf_replay -d tuf_replay_development"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - tuf-replay-postgres:/var/lib/postgresql/data
      - ./server/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro

  redis-ingest:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - tuf-replay-redis:/data
    ports:
      - "127.0.0.1:${REDIS_INGEST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  tuf-replay-web:
    build:
      context: .
      args:
        VITE_WEB_ADOFAI_EMBED_URL: ${VITE_WEB_ADOFAI_EMBED_URL:-https://web-adofai.impl1113.dev/embed/chart}
    image: tuf-replay-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TUF_REPLAY_WEB_PORT:-4174}:4173"

volumes:
  tuf-replay-local-objects:
  tuf-replay-local-cdn-cache:
  tuf-replay-postgres:
  tuf-replay-redis:

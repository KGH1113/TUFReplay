services:
  trusted-testers-admin:
    profiles: ["tester-admin"]
    build:
      context: ../tools/trusted-testers-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:4177:4177"
    environment:
      HOST: 0.0.0.0
      PORT: "4177"
      ALLOW_NON_LOOPBACK: "true"
      DATABASE_URL: "postgres://trusted_testers_admin:${TRUSTED_TESTERS_DB_PASSWORD:-}@postgres-production:5432/tuf_replay_auto_submission"
      ADMIN_USERNAME: ${TRUSTED_TESTERS_ADMIN_USERNAME:-operator}
      ADMIN_PASSWORD: ${TRUSTED_TESTERS_ADMIN_PASSWORD:-}
    depends_on:
      postgres-production:
        condition: service_healthy
    networks:
      - default
      - auto-submission-data

  tuf-replay-web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_WEB_ADOFAI_EMBED_URL: ${VITE_WEB_ADOFAI_EMBED_URL:-https://web-adofai.impl1113.dev/embed/chart}
        TUFREPLAY_ENVIRONMENT: auto-submission
        TUFREPLAY_BUILD_FLAVOR: auto-submission
        TUFREPLAY_BUILD_SHA: ${BUILD_SHA:-unknown}
    image: tuf-replay-web:auto-submission-${BUILD_SHA:-unknown}
    pull_policy: never
    restart: unless-stopped
    expose:
      - "4173"

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    image: tuf-replay-gateway:auto-submission-${BUILD_SHA:-unknown}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      tuf-replay-web:
        condition: service_healthy
      tuf-replay-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:4176:8080"
    volumes:
      - ./gateway/auto-submission-locations.auto.conf:/etc/nginx/auto-submission-locations.conf:ro
      - ${AUTO_UPDATES_DIR:-/home/kgh/tuf-replay-data/auto-submission/updates}:/srv/updates:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/_readiness || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s

  postgres-production:
    image: postgres:17-alpine
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TUF_REPLAY_DB_USER:?TUF_REPLAY_DB_USER must be set}
      POSTGRES_PASSWORD: ${TUF_REPLAY_DB_PASSWORD:?TUF_REPLAY_DB_PASSWORD must be set}
      POSTGRES_DB: tuf_replay_auto_submission
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - auto-submission-postgres:/var/lib/postgresql/data
    networks:
      - auto-submission-data

  redis-ingest-production:
    image: redis:8-alpine
    pull_policy: missing
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - auto-submission-redis:/data
    networks:
      - auto-submission-data

  tuf-replay-server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    image: tuf-replay-server:auto-submission-${BUILD_SHA:-unknown}
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - path: ${R2_ENV_FILE:-/home/kgh/tuf-replay-data/auto-submission/r2.env}
        required: false
      - path: /home/kgh/tuf-replay-data/auto-submission/cdn.env
        required: false
    environment:
      TUF_REPLAY_STORAGE: ${TUF_REPLAY_STORAGE:-local}
      R2_LOCAL_FALLBACK: ${R2_LOCAL_FALLBACK:-true}
      LOCO_ENV: production
      HOST: https://tufreplay-auto.impl1113.dev
      BINDING: 0.0.0.0
      PORT: "5150"
      SCHEDULER_CONFIG: config/scheduler.yaml
      DB_AUTO_MIGRATE: "false"
      DATABASE_URL: "postgres://${TUF_REPLAY_DB_USER:?TUF_REPLAY_DB_USER must be set}:${TUF_REPLAY_DB_PASSWORD:?TUF_REPLAY_DB_PASSWORD must be set}@postgres-production:5432/tuf_replay_auto_submission"
      QUEUE_URL: "postgres://${TUF_REPLAY_DB_USER:?TUF_REPLAY_DB_USER must be set}:${TUF_REPLAY_DB_PASSWORD:?TUF_REPLAY_DB_PASSWORD must be set}@postgres-production:5432/tuf_replay_auto_submission"
      REDIS_INGEST_URL: redis://redis-ingest-production:6379/0
      TUF_ARTIFACT_ROOT: /var/lib/tuf-replay/artifacts
      TUF_API_BASE_URL: https://api.tuforums.com
      TUF_WEB_ORIGIN: https://tuforums.com
      REPLAY_PLAYER_ORIGIN: ${REPLAY_PLAYER_ORIGIN:-https://web-adofai.impl1113.dev}
      REPLAY_BETA_ORIGIN: ${REPLAY_BETA_ORIGIN:-https://web-adofai.impl1113.dev}
      SUBMISSION_WEB_ORIGIN: https://tufreplay-auto.impl1113.dev
      TUF_TO_AUTO_SUBMISSION_TOKEN: ${TUF_TO_AUTO_SUBMISSION_TOKEN:?TUF_TO_AUTO_SUBMISSION_TOKEN must be set}
      AUTO_SUBMISSION_TO_TUF_TOKEN: ${AUTO_SUBMISSION_TO_TUF_TOKEN:?AUTO_SUBMISSION_TO_TUF_TOKEN must be set}
      SUBMISSION_VALIDATION_MODE: ${SUBMISSION_VALIDATION_MODE:-unavailable}
    depends_on:
      postgres-production:
        condition: service_healthy
      redis-ingest-production:
        condition: service_healthy
    volumes:
      - auto-submission-artifacts:/var/lib/tuf-replay/artifacts
    networks:
      - default
      - auto-submission-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:5150/_readiness"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

volumes:
  auto-submission-postgres:
  auto-submission-redis:
  auto-submission-artifacts:

networks:
  auto-submission-data:
    internal: true

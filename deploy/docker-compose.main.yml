services:
  tuf-replay-web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_WEB_ADOFAI_EMBED_URL: ${VITE_WEB_ADOFAI_EMBED_URL:-https://web-adofai.impl1113.dev/embed/chart}
        TUFREPLAY_ENVIRONMENT: main
        TUFREPLAY_BUILD_FLAVOR: standard
        TUFREPLAY_BUILD_SHA: ${BUILD_SHA:-unknown}
    image: tuf-replay-web:main-${BUILD_SHA:-unknown}
    pull_policy: never
    restart: unless-stopped
    expose:
      - "4173"

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    image: tuf-replay-gateway:main-${BUILD_SHA:-unknown}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      tuf-replay-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:4174:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/deployment.json || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s

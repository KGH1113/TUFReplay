name: Deploy (Guhyeon Kang's Home Server)

on:
  push:
    branches:
      - main
      - dev
      - feat/auto-submission
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-deploy-${{ github.ref_name == 'feat/auto-submission' && 'auto-submission' || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate deployment commit
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      branch: ${{ steps.target.outputs.branch }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate branch and full commit SHA
        id: target
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          case "$EVENT_REF" in
            refs/heads/main)
              deploy_environment=main
              deploy_branch=main
              ;;
            refs/heads/dev)
              deploy_environment=dev
              deploy_branch=dev
              ;;
            refs/heads/feat/auto-submission)
              deploy_environment=auto-submission
              deploy_branch=feat/auto-submission
              ;;
            *)
              echo "::error::Unsupported deployment ref: $EVENT_REF"
              exit 64
              ;;
          esac

          if [[ ! "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment requires a full lowercase Git commit SHA."
            exit 64
          fi

          checkout_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$checkout_sha" != "$EVENT_SHA" ]]; then
            echo "::error::The checked out commit does not match the GitHub event SHA."
            exit 1
          fi

          git fetch --force --no-tags --depth=1 origin "$deploy_branch"
          branch_tip_sha="$(git rev-parse --verify FETCH_HEAD)"
          if [[ "$branch_tip_sha" != "$EVENT_SHA" ]]; then
            echo "::error::The event commit is no longer the current branch tip."
            exit 1
          fi

          {
            printf 'environment=%s\n' "$deploy_environment"
            printf 'branch=%s\n' "$deploy_branch"
            printf 'sha=%s\n' "$EVENT_SHA"
          } >> "$GITHUB_OUTPUT"

  source_checks:
    name: Web and C# source checks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check TUFReplay TUFReplay.Tests

      - name: Check SSH deployment stdin isolation
        run: python3 deploy/scripts/test-deploy-stdin.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web tests
        run: bun run web:test

      - name: Typecheck web workspace
        run: bun run web:typecheck

      - name: Check web formatting and lint
        run: bun run web:biome

      - name: Build web workspace
        env:
          VITE_WEB_ADOFAI_EMBED_URL: https://web-adofai.impl1113.dev/embed/chart
        run: bun run web:build

  auto_server_checks:
    name: Auto-submission Rust checks
    needs: preflight
    if: ${{ needs.preflight.outputs.environment == 'auto-submission' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tuf_replay
          POSTGRES_PASSWORD: tuf_replay_dev
          POSTGRES_DB: tuf_replay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuf_replay -d tuf_replay_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tuf_replay:tuf_replay_dev@127.0.0.1:5432/tuf_replay_test
      QUEUE_URL: postgres://tuf_replay:tuf_replay_dev@127.0.0.1:5432/tuf_replay_test
      REDIS_INGEST_URL: redis://127.0.0.1:6379/1
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            server/target
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Check Rust lint
        run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust server
        run: cargo test --manifest-path server/Cargo.toml --locked

  build_and_deploy:
    name: Build and deploy tested images
    needs:
      - preflight
      - source_checks
      - auto_server_checks
    if: >-
      ${{ !cancelled() &&
          needs.preflight.result == 'success' &&
          needs.source_checks.result == 'success' &&
          (needs.auto_server_checks.result == 'success' ||
          needs.auto_server_checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1

      - name: Build tagged linux/amd64 deployment images
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
          DEPLOY_BRANCH: ${{ needs.preflight.outputs.branch }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "$(uname -s)" != Linux || "$(uname -m)" != x86_64 ]]; then
            echo "::error::Deployment images must be built on a Linux amd64 runner."
            exit 1
          fi

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment requires a full lowercase Git commit SHA."
            exit 64
          fi

          checkout_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$checkout_sha" != "$DEPLOY_SHA" ]]; then
            echo "::error::The image source checkout does not match the verified commit."
            exit 1
          fi

          git fetch --force --no-tags --depth=1 origin "$DEPLOY_BRANCH"
          branch_tip_sha="$(git rev-parse --verify FETCH_HEAD)"
          if [[ "$branch_tip_sha" != "$DEPLOY_SHA" ]]; then
            echo "::error::The deployment branch moved while source checks were running."
            exit 1
          fi

          case "$DEPLOY_ENVIRONMENT" in
            main)
              project_name=tufreplay-main
              compose_file=deploy/docker-compose.main.yml
              ;;
            dev)
              project_name=tufreplay-dev
              compose_file=deploy/docker-compose.dev.yml
              ;;
            auto-submission)
              project_name=tufreplay-auto
              compose_file=deploy/docker-compose.auto-submission.yml
              ;;
            *)
              echo "::error::Unsupported deployment environment: $DEPLOY_ENVIRONMENT"
              exit 64
              ;;
          esac

          compose_env_file="$RUNNER_TEMP/tuf-replay-compose-build.env"
          platform_override_file="$RUNNER_TEMP/tuf-replay-compose-platform.yml"
          auto_updates_dir="$RUNNER_TEMP/tuf-replay-build-updates"
          mkdir -p "$auto_updates_dir"

          {
            printf 'BUILD_SHA=%s\n' "$DEPLOY_SHA"
            printf '%s\n' 'VITE_WEB_ADOFAI_EMBED_URL=https://web-adofai.impl1113.dev/embed/chart'
            printf 'AUTO_UPDATES_DIR=%s\n' "$auto_updates_dir"
            if [[ "$DEPLOY_ENVIRONMENT" == auto-submission ]]; then
              # These build-only placeholders satisfy Compose interpolation; host secrets stay on the home server.
              printf '%s\n' \
                'TUF_REPLAY_DB_USER=build_only' \
                'TUF_REPLAY_DB_PASSWORD=build_only_password' \
                'TUF_TO_AUTO_SUBMISSION_TOKEN=build_only_token' \
                'AUTO_SUBMISSION_TO_TUF_TOKEN=build_only_token' \
                'SUBMISSION_VALIDATION_MODE=unavailable'
            fi
          } > "$compose_env_file"
          chmod 0600 "$compose_env_file"

          cat > "$platform_override_file" <<'YAML'
          services:
            tuf-replay-web:
              platform: linux/amd64
            gateway:
              platform: linux/amd64
          YAML
          if [[ "$DEPLOY_ENVIRONMENT" == auto-submission ]]; then
            cat >> "$platform_override_file" <<'YAML'
            tuf-replay-server:
              platform: linux/amd64
          YAML
          fi

          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          compose=(
            docker compose
            --project-name "$project_name"
            --env-file "$compose_env_file"
            --file "$compose_file"
            --file "$platform_override_file"
          )

          "${compose[@]}" config --quiet
          "${compose[@]}" build --pull

          images=(
            "tuf-replay-web:${DEPLOY_ENVIRONMENT}-${DEPLOY_SHA}"
            "tuf-replay-gateway:${DEPLOY_ENVIRONMENT}-${DEPLOY_SHA}"
          )
          if [[ "$DEPLOY_ENVIRONMENT" == auto-submission ]]; then
            images+=("tuf-replay-server:auto-submission-${DEPLOY_SHA}")
          fi

          for image in "${images[@]}"; do
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            if [[ "$platform" != linux/amd64 ]]; then
              echo "::error::Image $image was built for $platform instead of linux/amd64."
              exit 1
            fi
          done

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: kgh

      - name: Reuse existing SHA-tagged images and load missing ones
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -Eeuo pipefail

          images=(
            "tuf-replay-web:${DEPLOY_ENVIRONMENT}-${DEPLOY_SHA}"
            "tuf-replay-gateway:${DEPLOY_ENVIRONMENT}-${DEPLOY_SHA}"
          )
          if [[ "$DEPLOY_ENVIRONMENT" == auto-submission ]]; then
            images+=("tuf-replay-server:auto-submission-${DEPLOY_SHA}")
          fi

          remote_inventory="$(
            tailscale ssh kgh@kgh bash -s <<'REMOTE'
          set -Eeuo pipefail
          docker info >/dev/null
          docker image ls --format '{{.Repository}}:{{.Tag}}'
          REMOTE
          )"
          mapfile -t remote_tags <<< "$remote_inventory"

          # SHA-tagged images are immutable; retries reuse present tags and transfer only missing ones.
          missing_images=()
          for image in "${images[@]}"; do
            tag_present=false
            for remote_tag in "${remote_tags[@]}"; do
              if [[ "$remote_tag" == "$image" ]]; then
                tag_present=true
                break
              fi
            done

            if [[ "$tag_present" == true ]]; then
              echo "Reusing previously loaded $image"
            else
              missing_images+=("$image")
            fi
          done

          if [[ "${#missing_images[@]}" == 0 ]]; then
            echo "All expected SHA-tagged images already exist on the home server."
            exit 0
          fi

          image_archive="$RUNNER_TEMP/tuf-replay-images.tar.gz"
          docker save "${missing_images[@]}" | gzip --fast > "$image_archive"
          gzip --test "$image_archive"
          test -s "$image_archive"
          tailscale ssh kgh@kgh docker load < "$image_archive"
          rm -f "$image_archive"

      - name: Deploy verified commit on the home server
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test -f deploy/scripts/deploy-home.sh
          checkout_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$checkout_sha" != "$DEPLOY_SHA" ]]; then
            echo "::error::The deployment script does not come from the verified commit."
            exit 1
          fi

          tailscale ssh kgh@kgh bash -s -- "$DEPLOY_ENVIRONMENT" "$DEPLOY_SHA" < deploy/scripts/deploy-home.sh

      - name: Independently verify public deployment
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_ENVIRONMENT" in
            main) domain=tufreplay.impl1113.dev; flavor=standard ;;
            dev) domain=tufreplay-dev.impl1113.dev; flavor=standard ;;
            auto-submission) domain=tufreplay-auto.impl1113.dev; flavor=auto-submission ;;
            *) exit 64 ;;
          esac
          metadata_file="$RUNNER_TEMP/deployed-metadata.json"
          curl --fail --silent --show-error --max-time 20 "https://$domain/deployment.json" -o "$metadata_file"
          python3 - "$metadata_file" "$DEPLOY_ENVIRONMENT" "$flavor" "$DEPLOY_SHA" <<'PYCODE'
          import json
          import sys
          path, environment, flavor, sha = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              data = json.load(source)
          assert data.get("environment") == environment, "Unexpected deployment environment"
          assert data.get("buildFlavor") == flavor, "Unexpected web build flavor"
          assert data.get("gitSHA") == sha, "The tested commit was not deployed"
          PYCODE
          if [[ "$DEPLOY_ENVIRONMENT" == auto-submission ]]; then
            curl --fail --silent --show-error --max-time 20 "https://$domain/_readiness" >/dev/null
          fi

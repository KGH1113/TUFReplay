logger:
  enable: true
  pretty_backtrace: false
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  format: json

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  host: <%= get_env(name="HOST") %>
  identifier: tuf-replay-server

workers:
  mode: BackgroundAsync

queue:
  kind: Postgres
  uri: <%= get_env(name="QUEUE_URL") %>
  dangerously_flush: false

database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="true") %>
  dangerously_truncate: false
  dangerously_recreate: false

settings:
  auto_submission:
    redis_url: <%= get_env(name="REDIS_INGEST_URL") %>
    active_ttl_seconds: <%= get_env(name="RUN_ACTIVE_TTL_SECONDS", default="45") %>
    sealed_ttl_seconds: <%= get_env(name="RUN_SEALED_TTL_SECONDS", default="86400") %>
    hard_duration_seconds: <%= get_env(name="RUN_HARD_DURATION_SECONDS", default="21600") %>
    max_chunk_bytes: <%= get_env(name="RUN_MAX_CHUNK_BYTES", default="65536") %>
    max_session_bytes: <%= get_env(name="RUN_MAX_SESSION_BYTES", default="134217728") %>
    heartbeat_interval_ms: <%= get_env(name="RUN_HEARTBEAT_INTERVAL_MS", default="10000") %>
    tuf_api_base_url: <%= get_env(name="TUF_API_BASE_URL", default="https://api.tuforums.com") %>
    artifact_root: <%= get_env(name="TUF_ARTIFACT_ROOT") %>
    artifact_max_download_bytes: <%= get_env(name="TUF_ARTIFACT_MAX_DOWNLOAD_BYTES", default="536870912") %>
    artifact_max_extracted_bytes: <%= get_env(name="TUF_ARTIFACT_MAX_EXTRACTED_BYTES", default="2147483648") %>
    artifact_max_files: <%= get_env(name="TUF_ARTIFACT_MAX_FILES", default="20000") %>
    artifact_hydration_timeout_seconds: <%= get_env(name="TUF_ARTIFACT_HYDRATION_TIMEOUT_SECONDS", default="300") %>
    artifact_max_concurrent_hydrations: <%= get_env(name="TUF_ARTIFACT_MAX_CONCURRENT_HYDRATIONS", default="2") %>

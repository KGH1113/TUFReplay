logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: compact
server:
  port: 5151
  binding: 127.0.0.1
  host: http://127.0.0.1
  identifier: tuf-replay-local-game
  middlewares:
    cors:
      enable: true
      allow_origins: ["http://127.0.0.1:5176", "http://127.0.0.1:5180", "http://127.0.0.1:5190"]
      allow_headers: ["Content-Type", "Authorization"]
      allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
workers:
  mode: BackgroundQueue
queue:
  kind: Postgres
  uri: postgres://tuf_replay:tuf_replay_dev@127.0.0.1:5432/tuf_replay_local_game
  dangerously_flush: false
database:
  uri: postgres://tuf_replay:tuf_replay_dev@127.0.0.1:5432/tuf_replay_local_game
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
settings:
  auto_submission:
    validation_mode: trusted_tester
    redis_url: redis://127.0.0.1:6379/13
    redis_key_prefix: "local-game:"
    active_ttl_seconds: 45
    sealed_ttl_seconds: 86400
    hard_duration_seconds: 21600
    max_chunk_bytes: 65536
    max_session_bytes: 134217728
    heartbeat_interval_ms: 10000
    tuf_api_base_url: http://127.0.0.1:3002
    artifact_root: ../tools/live-e2e/.data/storage
    artifact_max_download_bytes: 536870912
    artifact_max_extracted_bytes: 2147483648
    artifact_max_files: 20000
    artifact_hydration_timeout_seconds: 300
    artifact_max_concurrent_hydrations: 2

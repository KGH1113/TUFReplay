logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  binding: localhost
  host: http://localhost
  identifier: tuf-replay-server

workers:
  mode: BackgroundAsync

queue:
  kind: Postgres
  uri: <%= get_env(name="DATABASE_URL", default="postgres://tuf_replay:tuf_replay_dev@127.0.0.1:5432/tuf_replay_test") %>
  dangerously_flush: false

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://tuf_replay:tuf_replay_dev@127.0.0.1:5432/tuf_replay_test") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

settings:
  auto_submission:
    redis_url: <%= get_env(name="REDIS_INGEST_URL", default="redis://127.0.0.1:6379/1") %>
    active_ttl_seconds: 45
    sealed_ttl_seconds: 86400
    hard_duration_seconds: 21600
    max_chunk_bytes: 65536
    max_session_bytes: 134217728
    heartbeat_interval_ms: 10000
    tuf_api_base_url: <%= get_env(name="TUF_API_BASE_URL", default="http://127.0.0.1:1") %>
    artifact_root: "storage/test-level-artifacts"
    artifact_max_download_bytes: 536870912
    artifact_max_extracted_bytes: 2147483648
    artifact_max_files: 20000
    artifact_hydration_timeout_seconds: 300
    artifact_max_concurrent_hydrations: 2
